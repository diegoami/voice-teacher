[project]
name = "session-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "httpx>=0.28.1",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
