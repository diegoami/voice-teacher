[project]
name = "voice-teacher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema[format-nongpl]>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/voice_teacher", "schemas"]

[tool.hatch.build.targets.sdist]
include = ["server/voice_teacher", "schemas", "pyproject.toml", "README.md", "uv.lock", "tests/contracts", "tests/engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
