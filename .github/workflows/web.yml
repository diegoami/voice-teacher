name: Web app
on:
  pull_request:
    paths: ['apps/web/**', 'server/**', 'schemas/**', 'tests/integration/browser_server.py', 'tests/contracts/fixtures/**', 'pyproject.toml', 'uv.lock', 'tools/cloud/**', 'tools/cloud_setup.sh', '.claude/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', 'server/**', 'schemas/**', 'tests/integration/browser_server.py', 'tests/contracts/fixtures/**', 'pyproject.toml', 'uv.lock', 'tools/cloud/**', 'tools/cloud_setup.sh', '.claude/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked synthetic browser-server dependencies
        working-directory: .
        run: |
          python3 -m venv /tmp/voice-teacher-web-tools
          /tmp/voice-teacher-web-tools/bin/pip install uv==0.12.18
          /tmp/voice-teacher-web-tools/bin/uv sync --locked --python 3.14
          echo "VOICE_TEACHER_TEST_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - name: Verify portable development imports and configuration
        working-directory: .
        run: .venv/bin/python tools/cloud/check_setup.py
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-browser-evidence
          path: apps/web/test-results/
          retention-days: 14
