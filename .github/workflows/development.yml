name: Development
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n tools/cloud_setup.sh .claude/hooks/session-start.sh
      - run: python3 -m unittest discover -s tests/cloud -v
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked backend
        run: |
          python3 -m venv /tmp/voice-teacher-tools
          /tmp/voice-teacher-tools/bin/pip install uv==0.12.18
          /tmp/voice-teacher-tools/bin/uv sync --locked --python 3.14
      - run: /tmp/voice-teacher-tools/bin/uv run --locked pytest -q
